name: Deploy Scout (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      # Kamal adds a different service label to each backend image. Never let
      # another role or destination overwrite the exact version being pulled.
      API_TAG: production-api-${{ github.sha }}
      MCP_TAG: production-mcp-${{ github.sha }}
      WORKER_TAG: production-worker-${{ github.sha }}
      CUBE_TAG: cube-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SCOUT_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deploy env vars
        run: |
          {
            echo "SCOUT_EC2_IP=${{ secrets.SCOUT_EC2_IP }}"
            echo "SCOUT_ECR_REGISTRY=${{ vars.SCOUT_ECR_REGISTRY }}"
            echo "SCOUT_REDIS_ENDPOINT=${{ secrets.SCOUT_REDIS_ENDPOINT }}"
            echo "SCOUT_RDS_SECRET_ARN=${{ secrets.SCOUT_RDS_SECRET_ARN }}"
            echo "SCOUT_RDS_ENDPOINT=${{ secrets.SCOUT_RDS_ENDPOINT }}"
          } >> "$GITHUB_ENV"

      - name: Validate production Cube secret
        shell: bash
        run: |
          cube_secret="$(aws secretsmanager get-secret-value \
            --secret-id SCOUT_CUBEJS_API_SECRET \
            --query SecretString \
            --output text)"
          test -n "$cube_secret"
          echo "::add-mask::$cube_secret"

      - name: Build and push Frontend image
        env:
          VITE_SENTRY_DSN: ${{ secrets.SCOUT_VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SCOUT_SENTRY_AUTH_TOKEN }}
        run: |
          : "${VITE_SENTRY_DSN:?SCOUT_VITE_SENTRY_DSN is required for frontend error reporting}"
          : "${IMAGE_TAG:?IMAGE_TAG is required for frontend release tracking}"
          docker build -t "$SCOUT_ECR_REGISTRY/scout/frontend:$IMAGE_TAG" \
            --platform linux/amd64 \
            -f Dockerfile.frontend \
            --label service=scout-frontend \
            --build-arg NGINX_CONF=frontend/nginx.prod-kamal.conf \
            --build-arg VITE_SENTRY_DSN \
            --build-arg VITE_SENTRY_ENVIRONMENT=production \
            --build-arg VITE_SENTRY_RELEASE="$IMAGE_TAG" \
            --build-arg SENTRY_ORG="${{ vars.SCOUT_SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ vars.SCOUT_SENTRY_FRONTEND_PROJECT }}" \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            .
          docker push "$SCOUT_ECR_REGISTRY/scout/frontend:$IMAGE_TAG"

      - name: Install Kamal
        # Drain label selection and non-proxied health polling are verified
        # against this version; upgrades require the same rollout checks.
        run: gem install kamal --version 2.12.0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Finish every backend build/push while existing workers still run.
      # Kamal supplies each role's service label; do not use a shared raw build.
      - name: Build and push API image
        run: kamal build push --version="$API_TAG"

      - name: Build and push MCP image
        run: kamal build push -c config/deploy-mcp.yml --version="$MCP_TAG"

      - name: Build and push Worker image
        run: kamal build push -c config/deploy-worker.yml --version="$WORKER_TAG"

      - name: Deploy Cube
        run: kamal deploy -c config/deploy-cube.yml --version="$CUBE_TAG"

      - name: Drain old workers
        id: drain_workers
        timeout-minutes: 12
        run: |
          ssh -T -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "scout@$SCOUT_EC2_IP" bash -s -- production 600 < scripts/drain-workers.sh

      - name: Deploy API
        # The API applies migrations before its health gate opens. Schema-
        # dependent MCP/worker code must not start before that succeeds.
        run: kamal deploy --skip-push --version="$API_TAG"

      - name: Deploy MCP
        run: kamal deploy -c config/deploy-mcp.yml --skip-push --version="$MCP_TAG"

      - name: Deploy Worker
        id: deploy_worker
        # Kamal's automatic prune is service-wide, not destination-scoped.
        # Preserve stopped workers referenced by either destination's receipts.
        run: kamal redeploy -c config/deploy-worker.yml --skip-push --version="$WORKER_TAG"

      - name: Deploy Frontend
        # Preserve the image built above, including its Sentry settings and maps.
        # A default Kamal deploy rebuilds this tag without those build inputs.
        run: kamal deploy -c config/deploy-frontend.yml --skip-push --version="$IMAGE_TAG"

      - name: Report interrupted backend handoff
        if: >-
          ${{ (failure() || cancelled()) &&
              (steps.drain_workers.outcome == 'success' ||
               steps.drain_workers.outcome == 'failure' ||
               steps.drain_workers.outcome == 'cancelled') &&
              steps.deploy_worker.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error title=Backend handoff interrupted::Production workers may be draining or stopped; queued jobs may be paused. Inspect the recovery steps in this run's summary before retrying."
          printf '%s\n' \
            '### Production backend handoff interrupted' \
            '' \
            'Production workers may be draining or stopped; queued jobs may be paused until a compatible worker is deployed.' \
            '' \
            '1. Inspect worker state, in-flight jobs, and pending receipts in the scout account home at .scout-worker-drains-v1/production/.' \
            '2. Resolve the failed drain, migration, health, or deployment step; then roll forward by rerunning the complete production deployment once the worker/job state is safe.' \
            '3. Do not blindly reboot old workers, force-stop them, or delete receipts. An old publisher can invalidate newly published source mappings; unconfirmed drains require operator inspection.' \
            '' \
            'See DEPLOYMENT.md: Migration-safe backend handoff. No automatic worker restart was attempted.' \
            >> "$GITHUB_STEP_SUMMARY"

name: Deploy Scout (Staging)

# Manual only — staging exists to test a branch before it merges, so the ref
# comes from the Actions ref picker. Tests are deliberately not a gate: the
# point is to get work-in-progress onto a real host.

on:
  workflow_dispatch:

concurrency:
  # Must match production: both destinations deploy to the same host.
  group: scout-deploy-host
  cancel-in-progress: false
  # GitHub supports up to 100 pending runs with this optional queue property:
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  queue: max

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bound setup/prebuild hangs too; post-drain steps have tighter limits.
    timeout-minutes: 90
    # Load-bearing for auth, not just bookkeeping: it switches the OIDC token's
    # sub claim from `ref:refs/heads/<branch>` to `environment:staging`, which is
    # the subject scout-github-deploy trusts for non-main refs. Remove it and
    # every branch deploy fails at AssumeRoleWithWebIdentity.
    environment: staging
    env:
      IMAGE_TAG: ${{ github.sha }}
      # Code layers are shared, but Kamal's service label differs by role.
      # Isolate exact versions from other roles and simultaneous prod deploys.
      API_TAG: staging-api-${{ github.sha }}
      MCP_TAG: staging-mcp-${{ github.sha }}
      WORKER_TAG: staging-worker-${{ github.sha }}
      # Staging has its own OAuth provider database and therefore cannot reuse
      # the production Connect client. These come from the GitHub `staging`
      # environment and are mapped into Kamal's container secret names.
      SCOUT_STAGING_CONNECT_OAUTH_CLIENT_ID: ${{ secrets.SCOUT_STAGING_CONNECT_OAUTH_CLIENT_ID }}
      SCOUT_STAGING_CONNECT_OAUTH_CLIENT_SECRET: ${{ secrets.SCOUT_STAGING_CONNECT_OAUTH_CLIENT_SECRET }}
      # Shared by the staging API, worker, MCP, and Cube containers. Keeping it
      # in the staging environment prevents a branch deploy from depending on
      # (or rotating) any future production Cube credential.
      SCOUT_CUBEJS_API_SECRET: ${{ secrets.SCOUT_STAGING_CUBEJS_API_SECRET }}
      # The frontend bakes in nginx and Sentry environment settings, so its
      # exact version must also be separate from production's.
      FRONTEND_TAG: staging-${{ github.sha }}
      # The Cube runtime uses the existing scout/mcp ECR repository; the MCP
      # process itself shares the API image, so that repository is otherwise idle.
      CUBE_TAG: cube-${{ github.sha }}
      # A deploy pulls several ~1 GB images; below this the pull itself can fail.
      HOST_MIN_FREE_GB: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SCOUT_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deploy env vars
        # `shell: bash` (not the default `bash -e`) so pipefail is on: the
        # SCOUT_DB_NAME pipeline below must abort the job when grep finds
        # nothing rather than exiting 0 on sed's status.
        shell: bash
        run: |
          {
            echo "SCOUT_EC2_IP=${{ secrets.SCOUT_EC2_IP }}"
            echo "SCOUT_ECR_REGISTRY=${{ vars.SCOUT_ECR_REGISTRY }}"
            echo "SCOUT_RDS_SECRET_ARN=${{ secrets.SCOUT_RDS_SECRET_ARN }}"
            echo "SCOUT_RDS_ENDPOINT=${{ secrets.SCOUT_RDS_ENDPOINT }}"
          } >> "$GITHUB_ENV"
          # Points DATABASE_URL at the staging database on the shared RDS
          # instance (scripts/resolve-database-url.sh). Silently missing, it
          # defaults to agent_platform and this job migrates and boots staging
          # against the PRODUCTION database — so fail hard instead.
          grep '^export SCOUT_DB_NAME=' config/staging.env | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Validate staging OAuth credentials
        shell: bash
        run: |
          test -n "$SCOUT_STAGING_CONNECT_OAUTH_CLIENT_ID"
          test -n "$SCOUT_STAGING_CONNECT_OAUTH_CLIENT_SECRET"
          test -n "$SCOUT_CUBEJS_API_SECRET"

      - name: Build and push Frontend image
        env:
          VITE_SENTRY_DSN: ${{ secrets.SCOUT_VITE_SENTRY_DSN }}
        run: |
          : "${VITE_SENTRY_DSN:?SCOUT_VITE_SENTRY_DSN is required for frontend error reporting}"
          : "${IMAGE_TAG:?IMAGE_TAG is required for frontend release tracking}"
          docker build -t "$SCOUT_ECR_REGISTRY/scout/frontend:$FRONTEND_TAG" \
            --platform linux/amd64 \
            -f Dockerfile.frontend \
            --label service=scout-frontend \
            --build-arg NGINX_CONF=frontend/nginx.staging-kamal.conf \
            --build-arg VITE_SENTRY_DSN \
            --build-arg VITE_SENTRY_ENVIRONMENT=staging \
            --build-arg VITE_SENTRY_RELEASE="$IMAGE_TAG" \
            .
          docker push "$SCOUT_ECR_REGISTRY/scout/frontend:$FRONTEND_TAG"

      - name: Install Kamal
        # Keep the worker labels and API health-polling contract reproducible.
        run: gem install kamal --version 2.12.0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Both destinations share one host. A full disk once failed every deploy
      # for six days: the first pull died, so Kamal's end-of-deploy prune never
      # ran. Prune before anything is pulled on the host, and stop with a clear
      # error if that still leaves too little room. See DEPLOYMENT.md: Host disk full.
      - name: Free host disk space
        timeout-minutes: 10
        run: |
          failed=0
          ssh -T -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "scout@$SCOUT_EC2_IP" bash -s -- prune-workers < scripts/host-disk-guard.sh \
            || { failed=$((failed + 1)); echo "::warning title=Prune failed::Worker container prune failed."; }
          # Same service-wide prune `kamal deploy` runs after a successful deploy.
          # Workers are excluded: the host script above guards their receipts.
          for config in config/deploy.yml config/deploy-mcp.yml config/deploy-cube.yml config/deploy-frontend.yml; do
            kamal prune all -c "$config" -d staging \
              || { failed=$((failed + 1)); echo "::warning title=Prune failed::kamal prune all -c $config failed."; }
          done
          kamal prune images -c config/deploy-worker.yml -d staging \
            || { failed=$((failed + 1)); echo "::warning title=Prune failed::Worker image prune failed."; }
          if (( failed > 0 )); then
            echo "Host prune: $failed of 6 commands failed; see the step's warnings." >> "$GITHUB_STEP_SUMMARY"
          fi
          # One failure is tolerable (the disk check below is the real gate), but
          # all of them failing means pruning is broken (e.g. a stale Kamal lock),
          # which would otherwise stay invisible until the disk fills again.
          if (( failed == 6 )); then
            echo "::error title=Host prune failed::Every prune command failed. Check SSH and kamal lock status before retrying."
            exit 1
          fi

      - name: Check host disk space
        timeout-minutes: 2
        run: |
          ssh -T -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "scout@$SCOUT_EC2_IP" bash -s -- check "$HOST_MIN_FREE_GB" < scripts/host-disk-guard.sh

      # Role-specific Kamal builds retain the correct service labels without
      # making a build/push failure pause the existing worker queue.
      - name: Build and push API image
        run: kamal build push -d staging --version="$API_TAG"

      - name: Build and push MCP image
        run: kamal build push -c config/deploy-mcp.yml -d staging --version="$MCP_TAG"

      - name: Build and push Worker image
        run: kamal build push -c config/deploy-worker.yml -d staging --version="$WORKER_TAG"

      - name: Deploy Cube
        run: kamal deploy -c config/deploy-cube.yml -d staging --version="$CUBE_TAG"

      - name: Drain old workers
        id: drain_workers
        timeout-minutes: 12
        run: |
          ssh -T -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "scout@$SCOUT_EC2_IP" bash -s -- staging 600 < scripts/drain-workers.sh

      - name: Deploy API
        # Migrate and pass the API's container health check before starting
        # new MCP/worker code that can select newly added columns.
        timeout-minutes: 10
        run: kamal deploy -d staging --skip-push --version="$API_TAG"

      - name: Deploy MCP
        timeout-minutes: 10
        run: kamal deploy -c config/deploy-mcp.yml -d staging --skip-push --version="$MCP_TAG"

      - name: Deploy Worker
        id: deploy_worker
        # Never service-prune another destination's pending-drain evidence.
        # app:boot refreshes this role's secret file and clear env each time.
        timeout-minutes: 10
        run: kamal redeploy -c config/deploy-worker.yml -d staging --skip-push --version="$WORKER_TAG"

      - name: Deploy Frontend
        # Preserve the staging image's baked-in nginx, environment, and release.
        timeout-minutes: 10
        run: kamal deploy -c config/deploy-frontend.yml -d staging --skip-push --version="$FRONTEND_TAG"

      - name: Report interrupted backend handoff
        if: >-
          ${{ (failure() || cancelled()) &&
              (steps.drain_workers.outcome == 'success' ||
               steps.drain_workers.outcome == 'failure' ||
               steps.drain_workers.outcome == 'cancelled') &&
              steps.deploy_worker.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error title=Backend handoff interrupted::Staging workers may be draining or stopped; queued jobs may be paused. Inspect the recovery steps in this run's summary before retrying."
          printf '%s\n' \
            '### Staging backend handoff interrupted' \
            '' \
            'Staging workers may be draining or stopped; queued jobs may be paused until a compatible worker is deployed.' \
            '' \
            '1. Inspect worker state, in-flight jobs, and pending receipts in the scout account home at .scout-worker-drains-v1/staging/.' \
            'If a timeout or cancellation left a Kamal lock, run kamal lock status with the same config and destination as the failed step. Release only a verified stale lock after confirming no deployment or remote operation is active.' \
            '2. Resolve the failed drain, migration, health, or deployment step; then roll forward by rerunning the complete staging deployment once the worker/job state is safe.' \
            '3. Do not blindly reboot old workers, force-stop them, or delete receipts. An old publisher can invalidate newly published source mappings; unconfirmed drains require operator inspection.' \
            '' \
            'See DEPLOYMENT.md: Migration-safe backend handoff. No automatic worker restart was attempted.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "### Staging deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$IMAGE_TAG\` |"
            echo "| URL | https://scout-staging.dimagi.com |"
          } >> "$GITHUB_STEP_SUMMARY"
